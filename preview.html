<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Website preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16181d;--mute:#5d6470;--bg:#fbf9f5;--card:#fff;--line:#ece6db;--brand:#9c3d22;--brand2:#14473f;--gold:#c99a3b;--shadow:0 10px 30px rgba(20,20,30,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font:16px/1.65 Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
img{display:block;max-width:100%}
a{color:inherit}
.serif{font-family:Fraunces,Georgia,serif}
.pbar{background:#0f1115;color:#e9e6df;font-size:13px;padding:8px 16px;text-align:center}
.pbar b{color:#fff}.pbar a{color:#ffcf6e;font-weight:600}
header{position:sticky;top:0;z-index:20;background:rgba(251,249,245,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{max-width:1160px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font:700 20px/1.1 Fraunces,serif;letter-spacing:-.01em}
.logo small{display:block;font:500 11px Inter,sans-serif;color:var(--mute);letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.links{display:flex;gap:22px;font-size:14px;font-weight:500}.links a{text-decoration:none;color:var(--mute)}.links a:hover{color:var(--ink)}
@media(max-width:760px){.links{display:none}}
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:12px 18px;border-radius:999px;text-decoration:none;border:0;cursor:pointer}
.b-wa{background:#25d366;color:#06351a}.b-dark{background:var(--ink);color:#fff}.b-light{background:#fff;color:var(--ink)}.b-ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4)}
.hero{position:relative;min-height:78vh;display:flex;align-items:flex-end;color:#fff;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.25) 40%,rgba(8,10,14,.82) 100%)}
.hero .in{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:0 16px 56px;width:100%}
.chip{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:999px;font-size:13px;margin-bottom:16px}
.hero h1{font:700 clamp(38px,7vw,76px)/1.02 Fraunces,serif;margin:0 0 14px;letter-spacing:-.02em;max-width:900px}
.hero p{font-size:clamp(16px,2.2vw,20px);max-width:620px;opacity:.92;margin:0 0 24px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.wrap{max-width:1160px;margin:0 auto;padding:0 16px}
section{padding:76px 0}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--brand);font-weight:700;margin:0 0 10px}
h2{font:700 clamp(30px,4.4vw,44px)/1.1 Fraunces,serif;margin:0 0 14px;letter-spacing:-.015em}
.lead{color:var(--mute);max-width:640px;font-size:17px;margin:0 0 36px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}@media(max-width:900px){.grid3{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.card img{aspect-ratio:4/3;object-fit:cover;width:100%}
.card .b{padding:20px}.card h3{font:700 22px Fraunces,serif;margin:0 0 6px}.card p{margin:0 0 14px;color:var(--mute)}
.price{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:14px;font-size:14px;color:var(--mute)}
.price b{color:var(--ink);font-size:17px}
.am{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}@media(max-width:760px){.am{grid-template-columns:1fr 1fr}}
.am div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;gap:12px;align-items:flex-start}
.am svg{flex:none;width:26px;height:26px;color:var(--brand2)}
.am b{display:block;font-size:15px}.am span{font-size:14px;color:var(--mute)}
.band{background:var(--brand2);color:#eef3f1}.band h2{color:#fff}.band .eyebrow{color:var(--gold)}.band .lead{color:#c9d8d3}
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:220px 220px;gap:12px}
.gal img{width:100%;height:100%;object-fit:cover;border-radius:14px}.gal img:first-child{grid-row:span 2}
@media(max-width:760px){.gal{grid-template-columns:1fr 1fr;grid-template-rows:160px 160px 160px}.gal img:first-child{grid-column:span 2;grid-row:auto}}
.two{display:grid;grid-template-columns:1fr 1.2fr;gap:34px;align-items:start}@media(max-width:900px){.two{grid-template-columns:1fr}}
.info{display:grid;gap:14px}.info div{display:flex;gap:12px}.info svg{width:22px;height:22px;flex:none;color:var(--brand)}
iframe{width:100%;height:360px;border:0;border-radius:18px;box-shadow:var(--shadow)}
form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;display:grid;gap:12px;box-shadow:var(--shadow)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.row{grid-template-columns:1fr}}
label{font-size:13px;font-weight:600;color:var(--mute);display:grid;gap:6px}
input,select,textarea{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fdfcfa;color:var(--ink);width:100%}
form .btn{justify-content:center;width:100%;padding:15px}
.note{font-size:13px;color:var(--mute);text-align:center;margin:0}
footer{background:#0f1115;color:#a9adb5;padding:44px 0 120px;font-size:14px}
footer .logo{color:#fff}.cred{font-size:11px;opacity:.6;margin-top:18px;line-height:1.5}
.fab{position:fixed;right:18px;bottom:86px;z-index:30;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fab svg{width:30px;height:30px;color:#fff}
.owner{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#ffcf6e;color:#1a1306;padding:12px 16px;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:600;box-shadow:0 -6px 20px rgba(0,0,0,.12)}
.owner a{background:#1a1306;color:#fff;padding:8px 14px;border-radius:999px;text-decoration:none;white-space:nowrap}
@media(max-width:600px){.owner{font-size:12.5px;padding:8px 12px;gap:8px;flex-wrap:nowrap;justify-content:space-between;text-align:left}.owner a{padding:7px 12px}.fab{bottom:74px;width:52px;height:52px}.pbar{font-size:11.5px;padding:6px 12px}}
#missing{padding:120px 16px;text-align:center}
</style>
</head>

   <div class="row">${k.f.map(([l,t])=> t==="room" ? `<label>${l}<select name="${l}">${k.items.map(x=>`<option>${x[0]}</option>`).join("")}</select></label>` : `<label>${l}<input name="${l}" type="${t}"></label>`).join("")}</div>
   <label>Message<textarea name="msg" rows="3" placeholder="Anything we should know?"></textarea></label>
   <button class="btn b-wa" type="submit">${I.wa.replace('<svg','<svg width="18" height="18"')} ${k.book}</button>
   <p class="note">Opens WhatsApp with your request ready to send.</p></form></div></section>
 <footer><div class="wrap"><div class="logo">${esc(b.name)}</div><p>${esc(b.address)}${b.phone?" · "+esc(b.phone):""}</p>
  <p>© ${new Date().getFullYear()} ${esc(b.name)}. Website preview by Sagar, Kathmandu.</p><div class="cred">Placeholder photos from Wikimedia Commons: ${credits}</div></div></footer>
 ${wa?`<a class="fab" href="${wa}" aria-label="WhatsApp">${I.wa}</a>`:""}
 <div class="owner"><span>Owner of ${esc(b.name)}? This can go live today. Pay nothing until you're happy.</span> <a href="./?from=${encodeURIComponent(id)}">Make it mine →</a></div>`;
 document.getElementById("f").addEventListener("submit", e=>{
  e.preventDefault(); const fd = new FormData(e.target);
  const lines = [`Hello ${b.name}, I'd like to ${k.form.toLowerCase()}.`]; for (const [kk,v] of fd) if (v) lines.push(`${kk}: ${v}`);
  const text = encodeURIComponent(lines.join("\n"));
  if (wa) window.open(`${wa}?text=${text}`, "_blank"); else if (b.email) location.href = `mailto:${b.email}?subject=${encodeURIComponent(k.form)}&body=${text}`; else alert("Please call us to book.");
 });
});
</script>
</body>
